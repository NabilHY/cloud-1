services:
  mariadb:
    secrets:
      - db_host
      - db_name
      - wp_db_pass
      - wp_admin_user
    image: mariadb:v1.0
    container_name: mariadb
    build: ./requirements/mariadb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${WORDPRESS_DB_USER}", "-p${WORDPRESS_DB_PASSWORD}"]
      timeout: 5s
      retries: 5
      interval: 1m
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always
    networks:
      - inception

  static_site:
    container_name: static_site
    image: static:v1.0
    build: ./requirements/static_site
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8081"]
      interval: 1m
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - inception
    ports:
      - "8081:8081"
    restart: always

  redis:
    container_name: redis
    build: ./requirements/redis
    image: redis:v1.0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - inception
    restart: always
    volumes:
      - wordpress_data:/var/www/html

  adminer:
    container_name: adminer
    build: ./requirements/adminer
    image: adminer:v1.0
    networks:
      - inception
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 1m
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      mariadb :
        condition: service_healthy
    restart: always

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    image: wordpress:v1.0
    volumes:
      - wordpress_data:/var/www/html
    secrets:
      - db_name
      - wp_admin_user
      - wp_db_pass
      - db_host
      - wp_redis_port
      - db_port
      - wp_user_name
      - wp_site_url
      - wp_site_title
      - wp_admin_user
      - wp_admin_pass
      - wp_admin_email
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - inception

  ftp:
    container_name: ftp
    build: ./requirements/ftp
    image: ftp:v1.0
    secrets:
      - ftp_user
      - ftp_pass
    depends_on:
      nginx:  
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "21"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - wordpress_data:/home/ftpuser
    networks:
      - inception
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    restart: always

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    image: nginx:v1.0
    secrets:
      -  domain_name
    depends_on:
      wordpress:
        condition: service_healthy
      static_site: 
        condition: service_healthy
      adminer: 
        condition: service_healthy
      portainer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "443"]
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    restart: always
    ports:
      - 443:443
    networks:
      - inception

  portainer:
    container_name: portainer
    build: ./requirements/portainer
    image: portainer:v1.0
    networks:
      - inception
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9443"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    ports:
      - 9443:9443
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  init-checker:
    image: alpine:3.22
    container_name: init-checker
    depends_on:
      nginx:
        condition: service_healthy
      ftp:
        condition: service_healthy
    restart: on-failure
    command: >
      sh -c "echo 'INFRASTRUCTURE DEPLOYED AND HEALTHY!'"

volumes:
  mariadb_data:
      name: db_data
      driver_opts:
        type: none
        device: /home/dash/dockVol/db
        o: bind

  wordpress_data:
      name: wp_data
      driver_opts:
        type: none
        device: /home/dash/dockVol/wp
        o: bind

  portainer_data:
      name: portainer_data
      driver_opts:
        type: none
        device: /home/dash/dockVol/portainer
        o: bind

secrets:
  db_host:
    file: ./secrets/mariadb/db_host.txt
  db_name:
    file: ./secrets/mariadb/db_name.txt
  db_port:
    file: ./secrets/mariadb/db_port.txt
  wp_db_pass:
    file: ./secrets/wordpress/wp_db_pass.txt
  wp_user_name:
    file: ./secrets/wordpress/wp_user_name.txt
  wp_admin_user:
    file: ./secrets/wordpress/wp_admin_user.txt
  wp_redis_port:
    file: ./secrets/redis/wp_redis_port.txt
  wp_site_url:
    file: ./secrets/wordpress/wp_site_url.txt
  wp_site_title:
    file: ./secrets/wordpress/wp_site_title.txt
  wp_admin_pass:
    file: ./secrets/wordpress/wp_admin_pass.txt
  wp_admin_email:
    file: ./secrets/wordpress/wp_admin_email.txt
  ftp_user:
    file: ./secrets/ftp/ftp_user.txt
  ftp_pass:
    file: ./secrets/ftp/ftp_pass.txt
  domain_name:
    file: ./secrets/nginx/domain_name.txt
  
  


networks:
  inception: