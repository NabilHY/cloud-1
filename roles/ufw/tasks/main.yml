- name: Install UFW package
  ansible.builtin.apt:
    name: ufw
    state: present

- name: UFW - Set default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    default: "{{ item.default }}"
  loop:
    - { direction: 'incoming', default: 'deny' }
    - { direction: 'outgoing', default: 'allow' }

- name: UFW - Allow outbound HTTP/HTTPS/DNS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    direction: out
  loop:
    - "53"
    - "80"
    - "443"

- name: UFW - Allow SSH incoming
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp

- name: UFW - Enable firewall
  community.general.ufw:
    state: enabled

