- name: Ensure build directory exists on target
  ansible.builtin.file:
    path: "{{ mariadb_build_dir }}"
    state: directory
    mode: '0755'

- name: Copy build context files to target machine
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ mariadb_build_dir }}/{{ item }}"
    mode: '0644'
  loop:
    - Dockerfile
    - entrypoint.sh
    - custom.cnf

- name: Ensure entrypoint script has exec perms
  ansible.builtin.file:
    path: "{{ mariadb_build_dir }}/entrypoint.sh"
    mode: '0755'

- name: Build and execute container using image_build role
  ansible.builtin.include_tasks:
    file: ../../image_build/tasks/main.yml
  vars:
    container_name: "{{ mariadb_container_name }}"
    docker_build_dir: "{{ mariadb_build_dir }}"
    image: "{{ mariadb_container_name }}" 
    image_tag: "{{ mariadb_image_tag }}"
    docker_build_dir: "{{ mariadb_build_dir }}"
    host_port: "{{ mariadb_host_port }}"
    container_port: "{{ mariadb_container_port }}"


