- name: Create per-host Terraform directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../roles/terraform/files/{{ inventory_hostname }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

- name: Render Terraform config from template
  ansible.builtin.template:
    src: main.tf.j2
    dest: "{{ playbook_dir }}/../roles/terraform/files/{{ inventory_hostname }}/main.tf"
    mode: "0644"
  delegate_to: localhost
  become: false

- name: Provision EC2 with Terraform
  community.general.terraform:
    project_path: "{{ playbook_dir }}/../roles/terraform/files/{{ inventory_hostname }}"
    force_init: true
  environment:
    AWS_ACCESS_KEY_ID: "{{ vault_aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ vault_aws_secret_access_key }}"
  delegate_to: localhost
  become: false
