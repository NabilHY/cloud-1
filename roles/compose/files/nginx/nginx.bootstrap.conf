worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name $DOMAIN_NAME;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 503;
        }
    }
}
