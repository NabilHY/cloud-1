- name: Clean up any old broken docker repo config
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  become: yes

- name: Update apt cache and upgrade system packages
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 86400
    upgrade: dist
  become: yes

- name: Install Required Packages
  ansible.builtin.apt:
    name: 
      - ca-certificates 
      - curl
  become: yes

- name: Create apt keyrings directory with correct permissions
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: yes

- name: Download Docker official GPG KEY
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: true
  become: true

- name: Set File Permissions
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    state: file
    mode: 'a+r'
  become: true

- name: Set the stable docker repository
  ansible.builtin.apt_repository: 
    state: present
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    update_cache: yes
  become: true

- name: Install the docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
